<style>
  :root { --ink:#1E1E1E; --paper:#FBF8F4; --muted:#6B665F; --rule:#E4DED5; --accent:#A42C35; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { font-family:"Jost", system-ui, sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  header { max-width:1100px; margin:0 auto; padding:28px 24px; display:flex; align-items:center; }
  header a { display:flex; align-items:center; gap:12px; text-decoration:none; }
  header .mark { height:40px; width:auto; }
  header .word { height:16px; width:auto; }
  main { max-width:1100px; margin:0 auto; padding:24px 24px 64px; }
  .eyebrow { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 14px; }
  .eyebrow::before { content:""; width:28px; height:1px; background:var(--accent); }
  h1 { font-family:"Newsreader", Georgia, serif; font-weight:400; font-size:clamp(34px, 5vw, 56px); line-height:1.08; margin:0 0 14px; letter-spacing:-.01em; }
  .lede { max-width:620px; color:var(--muted); margin:0 0 36px; font-size:17px; }
  .frame { background:#000; border-radius:4px; overflow:hidden; box-shadow:0 18px 50px rgba(30,30,30,.14); }
  video { display:block; width:100%; height:auto; background:#000; }
  .note { margin:22px 0 0; font-size:14px; color:var(--muted); }
  footer { border-top:1px solid var(--rule); max-width:1100px; margin:0 auto; padding:24px; display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:space-between; font-size:14px; color:var(--muted); }
  footer a { color:var(--ink); text-decoration:none; }
  footer a:hover { color:var(--accent); }
  @media (max-width:600px) {
    header { padding:20px 16px; }
    main { padding:16px 16px 48px; }
    footer { padding:20px 16px; }
    .lede { font-size:16px; margin-bottom:28px; }
  }
</style>
</head>

<header>
  <a href="../../index.html" aria-label="Paul Pacey — home">

  </a>
</header>
<main>
  <p class="eyebrow">Private preview</p>
  <h1>Sample reel</h1>
  <p class="lede">A concept reel bringing still photographs to life through motion and music.</p>
  <div class="frame">
    <video controls playsinline preload="metadata" poster="poster.jpg" controlslist="nodownload" disablepictureinpicture oncontextmenu="return false;">
      <source src="reel.mp4" type="video/mp4">
      Your browser can't play this video.
    </video>
  </div>
  <p class="note">This page is private and includes student images. Please keep it internal and don't share the link.</p>
</main>
<footer>
  <span>Paul Pacey · <a href="mailto:paulpacey@gmail.com">paulpacey@gmail.com</a></span>

</footer>
